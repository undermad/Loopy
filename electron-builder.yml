appId: dev.loopy.app
productName: Loopy
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Loopy
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
fileAssociations:
  - ext: loopy
    name: Loopy Project
    description: Loopy project
    mimeType: application/x-loopy
    role: Editor
