name: coverage

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ !cancelled() }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- loopy-coverage -->';
            let body = `${marker}\n### Coverage\n\nNo coverage summary was produced.`;
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const total = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
              const row = (label, key) => `| ${label} | ${total[key].pct}% | ${total[key].covered} / ${total[key].total} |`;
              body = [
                marker,
                '### Coverage',
                '',
                '| Metric | Percent | Covered |',
                '|---|---|---|',
                row('Lines', 'lines'),
                row('Branches', 'branches'),
                row('Functions', 'functions'),
                row('Statements', 'statements'),
                '',
                'Threshold: 80% on every metric.',
              ].join('\n');
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
