name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  check:
    name: title matches the commit format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|perf|refactor|test|docs|build|ci|chore|revert): \S.*$/;
            const problems = [];
            if (!pattern.test(title)) problems.push('Title must be "type: summary" with one of feat, fix, perf, refactor, test, docs, build, ci, chore, revert and no scope.');
            if (title.length > 72) problems.push(`Title is ${title.length} characters; the limit is 72.`);
            if (/\.$/.test(title)) problems.push('Title must not end with a period.');
            if (problems.length > 0) core.setFailed(`Pull request title "${title}" is invalid:\n- ${problems.join('\n- ')}`);
